plugins {
    id 'fabric-loom' version '1.7.+'
    id 'java'
}

version = fabric_mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main {
    java.srcDir rootProject.file('common/src/main/java')
    resources.srcDir rootProject.file('common/src/main/resources')
}

loom {
    runs {
        client {
            client()
            ideConfigGenerated true
            runDir "run"
        }
    }
}

repositories {
    maven { url "https://cursemaven.com" }
    maven { url "https://maven.parchmentmc.org" }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.0"
    modCompileOnly "curse.maven:shoulder-surfing-reloaded-243190:7974110"
    modCompileOnly "curse.maven:better-combat-by-daedelus-639842:7287333"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
            mod_version: fabric_mod_version,
            mod_authors: mod_authors, mod_description: fabric_mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
